services:
  - type: web
    name: equity-researcher
    runtime: node
    plan: free
    branch: deploy/free-hosting
    buildCommand: npm ci --include=dev --no-audit && npm run build && npm prune --omit=dev --no-audit
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SEC_USER_AGENT
        sync: false
